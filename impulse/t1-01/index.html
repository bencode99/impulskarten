<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>01 Tabellen ansehen</title><style>
:root{--ink:#20313A;--grau:#53636D}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
     background:#FFFEFA;color:var(--ink);line-height:1.5;font-size:19px}
